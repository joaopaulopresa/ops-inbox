# Ops Inbox: the whole product on one machine.
#   docker compose up -d      then open http://localhost:5410
name: ops-inbox

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://opsinbox:opsinbox@postgres:5432/opsinbox
  S3_ENDPOINT: minio:9000
  S3_ACCESS_KEY: opsinbox
  S3_SECRET_KEY: opsinbox-secret
  S3_BUCKET: opsinbox
  IMAP_HOST: mail
  IMAP_PORT: "3143"
  IMAP_USER: bookings
  IMAP_PASSWORD: bookings-secret
  SMTP_HOST: mail
  SMTP_PORT: "3025"
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-v4.1-flash-1017}
  SEED_MODEL: ${SEED_MODEL:-meta-llama/llama-3.1-8b-instruct}
  # Recorded model answers shipped with the repository: the demo replays them without a key.
  MODEL_CACHE_READ_ONLY: /app/seed/recordings
  # Traces go to the local Langfuse when the observability profile runs (make up-all).
  LANGFUSE_PUBLIC_KEY: ${OPSINBOX_LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${OPSINBOX_LANGFUSE_SECRET_KEY:-}
  LANGFUSE_HOST: http://langfuse-web:3000
  READINGS_READ_ONLY: /app/seed/readings

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: http://localhost:3410
  NEXTAUTH_SECRET: ops-inbox-demo-nextauth-secret
  SALT: ops-inbox-demo-salt
  # Demo-only key (fixed so the local Langfuse survives restarts); generate your own: openssl rand -hex 32
  ENCRYPTION_KEY: "6f70732d696e626f782d64656d6f2d6b65792d6e6f742d666f722d7573653031"
  TELEMETRY_ENABLED: "false"
  DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: clickhouse
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: langfuse-redis
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: langfuse-secret
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: langfuse-secret
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opsinbox
      POSTGRES_PASSWORD: opsinbox
      POSTGRES_DB: opsinbox
    ports: ["127.0.0.1:54410:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsinbox -d opsinbox"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: opsinbox
      MINIO_ROOT_PASSWORD: opsinbox-secret
    ports: ["127.0.0.1:9410:9000", "127.0.0.1:9411:9001"]
    volumes: [objects:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Local mail server speaking SMTP and IMAP. Nothing leaves this machine.
  mail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=bookings:bookings-secret@larkspur.example
        -Dgreenmail.users.login=local_part
      JAVA_OPTS: -Djava.net.preferIPv4Stack=true -Xmx256m
    ports: ["127.0.0.1:3425:3025", "127.0.0.1:3443:3143", "127.0.0.1:8480:8080"]

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    environment: *app-env
    ports: ["127.0.0.1:8410:8000"]
    volumes:
      - model-cache:/var/lib/opsinbox/model-cache
      - ./seed:/app/seed:ro
      - ./reports:/app/reports:ro
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: { context: ., dockerfile: api/Dockerfile }
    command: python -m opsinbox.worker
    environment: *app-env
    volumes:
      - model-cache:/var/lib/opsinbox/model-cache
      - ./seed:/app/seed:ro
      - ./reports:/app/reports:ro
    depends_on:
      api: { condition: service_healthy }
      mail: { condition: service_started }

  web:
    build: ./web
    ports: ["127.0.0.1:5410:80"]
    depends_on:
      api: { condition: service_healthy }

  # Scheduled backups of PostgreSQL and the object store into ./backups.
  backup:
    build: ./deploy/backup
    environment:
      BACKUP_INTERVAL: "3600"
      BACKUP_KEEP: "48"
    volumes: ["./backups:/backups"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

  # ---- observability (docker compose --profile observability up -d) ----
  prometheus:
    image: prom/prometheus:latest
    profiles: [observability]
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9490:9090"]

  grafana:
    image: grafana/grafana:latest
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ops-inbox-demo
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ops-inbox.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3420:3000"]
    depends_on: [prometheus]

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    profiles: [observability]
    environment:
      <<: *langfuse-env
      HOSTNAME: 0.0.0.0
      LANGFUSE_INIT_ORG_ID: larkspur
      LANGFUSE_INIT_ORG_NAME: Larkspur Classic Car Hire
      LANGFUSE_INIT_PROJECT_ID: ops-inbox
      LANGFUSE_INIT_PROJECT_NAME: Ops Inbox
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-ops-inbox-demo
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-ops-inbox-demo
      LANGFUSE_INIT_USER_EMAIL: owner@larkspur.example
      LANGFUSE_INIT_USER_NAME: Owner
      LANGFUSE_INIT_USER_PASSWORD: ops-inbox-demo
    ports: ["127.0.0.1:3410:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/public/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 40
    depends_on:
      langfuse-db: { condition: service_healthy }
      langfuse-clickhouse: { condition: service_healthy }
      langfuse-redis: { condition: service_started }
      langfuse-minio: { condition: service_started }

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    profiles: [observability]
    environment: *langfuse-env
    depends_on:
      langfuse-db: { condition: service_healthy }
      langfuse-clickhouse: { condition: service_healthy }

  langfuse-db:
    image: postgres:17-alpine
    profiles: [observability]
    environment: { POSTGRES_USER: langfuse, POSTGRES_PASSWORD: langfuse, POSTGRES_DB: langfuse }
    volumes: [langfuse-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 3s
      retries: 20

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3
    profiles: [observability]
    user: "101:101"
    environment: { CLICKHOUSE_DB: default, CLICKHOUSE_USER: clickhouse, CLICKHOUSE_PASSWORD: clickhouse }
    volumes: [langfuse-clickhouse:/var/lib/clickhouse]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      retries: 30

  langfuse-redis:
    image: redis:7-alpine
    profiles: [observability]
    command: ["redis-server", "--requirepass", "langfuse-redis"]

  langfuse-minio:
    image: cgr.dev/chainguard/minio:latest-dev
    profiles: [observability]
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" /data'
    environment: { MINIO_ROOT_USER: langfuse, MINIO_ROOT_PASSWORD: langfuse-secret }
    volumes: [langfuse-objects:/data]

volumes:
  pgdata:
  objects:
  model-cache:
  langfuse-pg:
  langfuse-clickhouse:
  langfuse-objects:

networks:
  default:
    ipam:
      config:
        - subnet: 10.214.5.0/24
