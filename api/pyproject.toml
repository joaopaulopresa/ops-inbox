[project]
name = "opsinbox"
version = "0.1.0"
description = "Back-office automation for a business that runs on e-mail and spreadsheets"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langgraph>=1.2.21",
    "langgraph-checkpoint-postgres>=3.2.0",
    "minio>=7.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdfium2>=5.15.2",
    "pytesseract>=0.3.13",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opsinbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: calls the real model through OpenRouter (needs a key, costs money)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = ["D203", "D213", "D104", "D105", "D107", "D401", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"migrations/**" = ["D"]
# Synthetic text data: long literal sentences read better unbroken.
"src/opsinbox/seedgen/**" = ["E501"]
"src/opsinbox/extraction/prompts.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["opsinbox"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["minio.*", "pypdfium2.*", "pytesseract.*", "weasyprint.*"]
ignore_missing_imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.File"]
